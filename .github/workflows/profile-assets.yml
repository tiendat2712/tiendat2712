name: Refresh GitHub profile

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_profile.py
      - .github/workflows/profile-assets.yml

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch real data and render profile visuals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py
      - name: Commit generated profile snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile-stats.svg assets/language-stats.svg assets/contribution-trail.svg assets/contributions-3d.svg assets/github-profile-data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh GitHub profile snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
